[package]
name              = "phoenix-runtime-desktop"
description       = "phoenix on Desktop Phoenix: GPUI settings and accessories, the HTTP transport hooks and the tray"
edition.workspace = true
license.workspace = true
version.workspace = true

[target.'cfg(any(windows, all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
base64             = "0.22"
flub               = { workspace = true }
image              = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
log                = { workspace = true }
phoenix-hook       = { workspace = true }
phoenix-runtime    = { features = [ "sqlite" ], workspace = true }
phoenix-sigs       = { workspace = true }
phoenix-ui-desktop = { workspace = true }
rquickjs           = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
thumbhash          = "0.1"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
